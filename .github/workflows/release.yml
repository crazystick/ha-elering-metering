name: Release

# Publishes a GitHub release when a version tag (v1.2.3) is pushed.
# The notes are the matching section of CHANGELOG.md.
on:
  push:
    tags: ["v*.*.*"]

# No permissions by default; only the release job may write, and only contents.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches manifest.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r .version custom_components/estfeed/manifest.json)"
          if [ "$manifest" != "$version" ]; then
            echo "::error::manifest.json has version $manifest, tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="[$version]" 'index($0, "## " v) == 1 {p = 1; next} /^## \[/ {p = 0} p' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::No CHANGELOG.md section for $version"
            exit 1
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
